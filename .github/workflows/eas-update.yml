name: eas-update

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a publish that has not started yet.
concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 12.9.1

jobs:
  verify:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec expo lint

  publish:
    name: Publish OTA update
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add an EXPO_TOKEN secret to this repository. See docs/ARCHITECTURE-NOTES.md, layer B."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show the runtime version this update will carry
        run: pnpm exec expo-updates fingerprint:generate --platform android

      # The commit message goes through an environment variable, never straight
      # into the shell command, so quotes in a message cannot break the step.
      - name: Publish update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: >
          eas update
          --branch production
          --platform android
          --environment production
          --non-interactive
          --message "${COMMIT_MESSAGE:-Manual run}"
